name: SASA CI & Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────────
  # Lint — single fast job, whole repo, ruff config lives in pyproject.toml
  # ────────────────────────────────────────────────────────────
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Pinned: ruff's default rule set changes between minor releases, and an
      # unpinned install would turn CI red on an unrelated upgrade.
      - name: Install ruff
        run: pip install 'ruff==0.16.2'

      - name: ruff check
        run: ruff check . --output-format=github

  # ────────────────────────────────────────────────────────────
  # Test — install the package, then run the suite
  # ────────────────────────────────────────────────────────────
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          # The hosted runner image carries third-party apt repositories (azure-cli,
          # chrome) that SASA does not need. When one is briefly unavailable,
          # `apt-get update` exits 100 and fails the build for a reason unrelated to
          # this project -- which is what happened on ubuntu/py3.12 while the other
          # two Ubuntu jobs passed.
          #
          # Do NOT try to delete the offending lists: on Noble the main Ubuntu
          # archives themselves live in /etc/apt/sources.list.d/ubuntu.sources, so a
          # wildcard removal takes out the repositories libsndfile1 comes from.
          #
          # A refresh failure is tolerated; the install immediately after is not, so
          # a genuinely missing package still fails the job.
          sudo apt-get update -o Acquire::Retries=3 || echo "apt-get update reported an error; continuing to install"
          sudo apt-get install -y --no-install-recommends libsndfile1 python3-tk

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify the package imports and the console script is wired
        run: |
          python -c "import main, calibration, weighting, bands, metrics, shot_detect, STFT; print('imports OK')"
          sasa --help

      # Unconditional: tests/ exists and is green (182 passing at time of
      # writing), so a missing or empty suite is a failure, not a skip.
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/ -q

  # ────────────────────────────────────────────────────────────
  # Binaries — only for tags and manual runs; unchanged behaviour
  # ────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS app
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install '.[video,build]'

      - name: Generate app icons
        run: python assets/generate_icon.py

      - name: Build macOS app
        run: pyinstaller sasa.spec --noconfirm --clean

      # Signing runs only when the certificate secret exists, so the workflow
      # keeps working unchanged until it is added and starts signing the moment
      # it is. The certificate goes into a throwaway keychain that is deleted
      # in the cleanup step below, whatever the outcome.
      # `secrets` is available to a step's `if`; a step-level `env` is not
      # available to its own `if`, which would have made this never run.
      - name: Import the signing certificate
        if: ${{ secrets.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/sasa-signing.keychain-db"
          PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package, sign and notarize the macOS app
        env:
          SASA_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          SASA_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          SASA_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          # A release tag must not ship silently unsigned once signing is set
          # up; an ordinary branch build may.
          SASA_REQUIRE_SIGNED: ${{ (secrets.MACOS_CERTIFICATE != '' && startsWith(github.ref, 'refs/tags/')) && '1' || '0' }}
        run: |
          if [ -d dist/SASA.app ]; then
            ./scripts/sign_macos.sh
          else
            # One-file build: nothing signable, package it as before.
            (cd dist && zip -r ../SASA-macOS.zip SASA/)
          fi
          # sign_macos.sh produces the zip when it signs; when it could not, it
          # exits 0 without one, so make the unsigned zip here.
          if [ ! -f SASA-macOS.zip ] && [ -d dist/SASA.app ]; then
            ditto -c -k --keepParent dist/SASA.app SASA-macOS.zip
          fi

      - name: Report signing status
        run: |
          if codesign -dv --verbose=2 dist/SASA.app 2>&1 | grep -q "Developer ID Application"; then
            if xcrun stapler validate dist/SASA.app > /dev/null 2>&1; then
              echo "::notice title=Signed and notarized::SASA-macOS.zip is signed with a Developer ID certificate and has a stapled notarization ticket."
            else
              echo "::warning title=Signed, not notarized::SASA-macOS.zip is signed but has no stapled ticket. Gatekeeper will still warn on first launch."
            fi
          else
            echo "::warning title=Unsigned build::SASA-macOS.zip is NOT signed with a Developer ID certificate. Gatekeeper will block it on other Macs. Add the MACOS_CERTIFICATE secret; see scripts/sign_macos.sh."
          fi

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/sasa-signing.keychain-db" || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SASA-macOS
          path: SASA-macOS.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SASA-macOS.zip

  build-windows:
    name: Build Windows exe
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[video,build]"

      - name: Generate app icons
        run: python assets/generate_icon.py

      - name: Build Windows exe
        run: pyinstaller sasa.spec --noconfirm --clean

      - name: Package Windows exe
        shell: pwsh
        run: |
          if (Test-Path "dist\SASA.exe") {
            Compress-Archive -Path "dist\SASA.exe" -DestinationPath "SASA-Windows.zip" -Force
          } elseif (Test-Path "dist\SASA") {
            Compress-Archive -Path "dist\SASA\*" -DestinationPath "SASA-Windows.zip" -Force
          } else {
            Write-Error "No build output found in dist\"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SASA-Windows
          path: SASA-Windows.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SASA-Windows.zip
